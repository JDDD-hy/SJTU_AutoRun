[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "sjtuautorun"
version = "0.0.1.5"
description = "交我润"
readme = "README.md"
authors = ["cwlm_ma"]
license = "MIT"


[tool.poetry.dependencies]
python = "^3.9"
opencv-contrib-python = "4.5.4.60"
airtest = "^1.3.1"
numpy = ">=1.21,<2"
PyYAML = "^6.0"
Pillow = ">=9,<12"
geopy = "^2.4.1"

[tool.poetry-version-plugin]
source = "init"


[tool.black]
line-length = 128
